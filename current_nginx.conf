# Optimized Nginx Configuration for Luma Identity - FIXED VERSION
# Based on your current setup with performance enhancements
# Windows-compatible version
# FIXED: Increased limits to handle load testing

# user  nobody;  # Not supported on Windows, commented out
worker_processes  auto;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;

events {
    worker_connections  4096;
    multi_accept on;
    # use epoll;  # Linux only - removed for Windows compatibility
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_tokens off;  # Hide nginx version

    # Buffer sizes
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    client_max_body_size 10M;

    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml
               application/x-font-ttf application/x-font-opentype
               font/woff font/woff2;
    gzip_disable "msie6";

    # Rate limiting zones - INCREASED for load testing
    # Note: Load tests come from single IP, so limits need to be higher
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=500r/s;      # Increased from 50r/s
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=1000r/s; # Increased from 100r/s
    limit_req_zone $binary_remote_addr zone=strict_limit:10m rate=10r/s;

    # Connection limits - INCREASED significantly
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream for Next.js frontend (lumaidentity.com)
    upstream nextjs_backend {
        least_conn;
        server 127.0.0.1:3002 max_fails=10 fail_timeout=60s;  # Increased max_fails, longer timeout
        keepalive 64;
    }

    # Upstream for Flask backend API (api.lumaidentity.com)
    upstream flask_backend {
        least_conn;
        server 127.0.0.1:5000 max_fails=10 fail_timeout=60s;  # Increased max_fails, longer timeout
        keepalive 32;
    }

    # Upstream for behavioralhub.xyz
    upstream behavioralhub_backend {
        least_conn;
        server 127.0.0.1:3000 max_fails=10 fail_timeout=60s;
        keepalive 32;
    }

    # HTTP to HTTPS redirect for all domains
    server {
        listen       80;
        server_name  behavioralhub.xyz lumaidentity.com www.lumaidentity.com api.lumaidentity.com;
        return 301 https://$server_name$request_uri;
    }

    # behavioralhub.xyz server block
    server {
        listen 443 ssl;
        http2 on;
        server_name behavioralhub.xyz;

        ssl_certificate C:/ssl/behavioralhub.xyz/fullchain.pem;
        ssl_certificate_key C:/ssl/behavioralhub.xyz/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Connection limits - INCREASED
        limit_conn conn_limit 200;  # Increased from 20 to 200

        # Static file caching
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://behavioralhub_backend;
            proxy_cache_valid 200 30d;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location / {
            limit_req zone=general_limit burst=200 nodelay;  # Increased burst from 50 to 200
            
            proxy_pass http://behavioralhub_backend;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }
    }

    # lumaidentity.com - Next.js Frontend
    server {
        listen 443 ssl;
        http2 on;
        server_name lumaidentity.com www.lumaidentity.com;

        ssl_certificate C:/ssl/lumaidentity.com/fullchain.pem;
        ssl_certificate_key C:/ssl/lumaidentity.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

        # Connection limits - INCREASED significantly
        limit_conn conn_limit 200;  # Increased from 20 to 200 (10x increase)

        # Static file caching with long TTL
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp|avif)$ {
            proxy_pass http://nextjs_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            
            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 1m;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Next.js static assets (_next/static)
        location /_next/static/ {
            proxy_pass http://nextjs_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            
            proxy_cache_valid 200 365d;
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Main location block
        location / {
            limit_req zone=general_limit burst=200 nodelay;  # Increased burst from 50 to 200
            
            proxy_pass http://nextjs_backend;
            proxy_http_version 1.1;
            
            # WebSocket support (for future use)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            # Cache dynamic content for short period
            proxy_cache_valid 200 302 10m;
            proxy_cache_valid 404 1m;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # api.lumaidentity.com - Flask Backend API
    server {
        listen 443 ssl;
        http2 on;
        server_name api.lumaidentity.com;

        ssl_certificate C:/ssl/api.lumaidentity.com/fullchain.pem;
        ssl_certificate_key C:/ssl/api.lumaidentity.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Connection limits - INCREASED
        limit_conn conn_limit 200;  # Increased from 20 to 200

        # API endpoints with rate limiting
        location /api/ {
            limit_req zone=api_limit burst=100 nodelay;  # Increased burst from 20 to 100
            limit_req_status 429;
            
            proxy_pass http://flask_backend;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            # Don't buffer request body for file uploads
            proxy_request_buffering off;
        }

        # WebSocket support for Socket.IO
        location /socket.io/ {
            # No rate limiting for WebSocket connections
            proxy_pass http://flask_backend;
            proxy_http_version 1.1;
            
            # WebSocket specific headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Extended timeouts for WebSocket
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        # File serving endpoint (if you have file uploads)
        location /messages/file/ {
            limit_req zone=api_limit burst=50 nodelay;  # Increased from 10 to 50
            
            proxy_pass http://flask_backend;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Cache file responses
            proxy_cache_valid 200 1h;
            expires 1h;
            add_header Cache-Control "public";
        }

        # Root location (fallback)
        location / {
            limit_req zone=api_limit burst=100 nodelay;  # Increased from 20 to 100
            
            proxy_pass http://flask_backend;
            proxy_http_version 1.1;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # Default server block (catch-all)
    server {
        listen       80 default_server;
        listen       443 ssl default_server;
        http2 on;
        server_name  _;

        ssl_certificate C:/ssl/lumaidentity.com/fullchain.pem;
        ssl_certificate_key C:/ssl/lumaidentity.com/privkey.pem;

        return 444;  # Close connection without response
    }
}

